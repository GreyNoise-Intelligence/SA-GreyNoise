disabled = 1
cron_schedule = 0 * * * *
enableSched = 1

[greynoise_overview]
search = | gnoverview \
	| table classification stats_field stats_value stats_count \
	| outputlookup gn_overview_lookup override_if_empty=false
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 1
cron_schedule = 0 */6 * * *
enableSched = 1

[greynoise_overview_once]
search = | gnoverview \
	| table classification stats_field stats_value stats_count \
	| outputlookup gn_overview_lookup override_if_empty=false
dispatch.earliest_time = -24h
dispatch.latest_time = now

[greynoise_cache_maintenance]
search = | maintaincache
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1

[greynoise_feed_once]
search = | gnquery query=[inputlookup gn_feed_lookup | sort -created | head 1 | eval query="".query | return query] exclude_raw=True result_size=2000000 page_size=10000 \
    | spath output=tags path=results.internet_scanner_intelligence.tags{}.name \
    | stats \
        values(actor) AS actor \
        values(first_seen) as first_seen \
        values(last_seen) as last_seen \
        values(classification) as classification \
        values(cves) as cves \
        values(source_country) as source_country \
        values(asn) as asn \
        values(tags) AS tags \
        by ip \
	| rename ip as _key \
    | table _key, actor, first_seen, last_seen, classification, tags, cves, source_country, asn \
    | outputlookup greynoise_indicators key_field=_key
alert.track = 0

[greynoise_feed]
search = | gnquery query=[inputlookup gn_feed_lookup | sort -created | head 1 | eval query="".query | return query] exclude_raw=True result_size=2000000 page_size=10000 \
    | spath output=tags path=results.internet_scanner_intelligence.tags{}.name \
    | stats \
        values(actor) AS actor \
        values(first_seen) as first_seen \
        values(last_seen) as last_seen \
        values(classification) as classification \
        values(cves) as cves \
        values(source_country) as source_country \
        values(asn) as asn \
        values(tags) AS tags \
        by ip \
	| rename ip as _key \
    | table _key, actor, first_seen, last_seen, classification, tags, cves, source_country, asn \
    | outputlookup greynoise_indicators key_field=_key
disabled = 1
cron_schedule = 0 3 * * *
enableSched = 1

[greynoise_feed_purge]
search = | inputlookup greynoise_indicators \
    | eval nowstring=strftime(relative_time(now(),"-7d@d" ),"%Y-%m-%d") \
    | where last_seen > nowstring \
    | table _key, actor, first_seen, last_seen, classification, tags, cves, source_country, asn\
    | outputlookup greynoise_indicators key_field=_key create_empty=true
disabled = 1
cron_schedule = 0 0 * * *
enableSched = 1