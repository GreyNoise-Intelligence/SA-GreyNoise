---
repos:
  - repo: local
    hooks:
      - id: yamllint
        name: Style check (yamllint)
        entry: yamllint
        language: system
        exclude: ^APP_FILES_ONLY/SA-GreyNoise/bin/SA_GreyNoise/
        types:
          - yaml
      - id: black
        name: Style check (black)
        entry: black
        language: system
        exclude: ^APP_FILES_ONLY/SA-GreyNoise/bin/SA_GreyNoise/
        types:
          - python
      - id: isort
        name: Style check (isort)
        entry: isort
        language: system
        exclude: ^APP_FILES_ONLY/SA-GreyNoise/bin/SA_GreyNoise/
        types:
          - python
      - id: flake8
        name: Static analysis (flake8)
        entry: flake8
        language: system
        exclude: ^APP_FILES_ONLY/SA-GreyNoise/bin/SA_GreyNoise/
        types:
          - python
      - id: pytest
        name: Regression tests (pytest)
        entry: pytest
        language: python
        additional_dependencies:
          - pytest>=8.0
        pass_filenames: false
        files: ^(tests/|pytest\.ini|APP_FILES_ONLY/SA-GreyNoise/(bin|default|README)/)
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.17.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint]
