[gnip-command]
syntax = gnip ip="<ip_address>"
description = This command fetches the context information of the given IP address using GreyNoise python SDK.
shortdesc = Retrieves context information about IP from the GreyNoise.
example1 = | gnip ip="<ip_address>"
comment1 = Retrieve the context information of the given ip_address
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = context

[ip_address]
syntax = <string>
description = IP address for which context/noise info needs to be retrieved from GreyNoise

[gnquick-command]
syntax = gnquick ip="<ip_address/comma_separated_ip_addresses>" ip_field="<ip_field>"
description = When IP addresses provided using ip parameter, this command retrieves Internet Scanner and Business Service Intelligence status \
              of the given IP addresses and when used with SPL_QUERY with ip_field parameter, this command retrieves \
              Internet Scanner and Business Service Intelligence status of IP addresses represented by ip_field using GreyNoise python SDK.
shortdesc = Retrieves Internet Scanner and Business Service Intelligence status of the given IP addresses from the GreyNoise.
example1 = | gnquick ip="<ip_address1>,<ip_address2>,<ip_address3>" [OR] SPL_QUERY | gnquick ip_field="<ip_field>"
comment1 = Retrieve the Internet Scanner and Business Service Intelligence status for all IPs retrieved from the SPL_QUERY for specified ip_field or retrieve \
           the Internet Scanner and Business Service Intelligence status of all the IP addresses as separate events
example2 = | gnquick ip="<ip_address>"
comment2 = Retrieve the Internet Scanner and Business Service Intelligence status of the given ip_address
usage = public
appears-in = 3.1.0
maintainer = GreyNoise
tags = quick

[gnippsychic-command]
syntax = gnippsychic ip="<ip_address/comma_separated_ip_addresses>" ip_field="<ip_field>"
description = When IP addresses provided using ip parameter, this command retrieves Psychic lookup results \
              for the given IP addresses and when used with SPL_QUERY with ip_field parameter, this command enriches \
              events with Psychic lookup results for IP addresses represented by ip_field using GreyNoise python SDK.
shortdesc = Retrieves Psychic lookup results for the given IP addresses from GreyNoise.
example1 = | gnippsychic ip="<ip_address1>,<ip_address2>,<ip_address3>" [OR] SPL_QUERY | gnippsychic ip_field="<ip_field>"
comment1 = Retrieve Psychic lookup results for all IPs retrieved from the SPL_QUERY for specified ip_field or retrieve \
           Psychic lookup results for all the IP addresses as separate events
example2 = | gnippsychic ip="<ip_address>"
comment2 = Retrieve Psychic lookup results for the given ip_address
usage = public
appears-in = 3.1.0
maintainer = GreyNoise
tags = psychic

[ip_address/comma_separated_ip_addresses]
syntax = <ip_address> | <ip_address>,<ip_address>,<ip_address>

[gnquery-command]
syntax = gnquery query="<GNQL_query>" result_size="<int>" page_size="<int>" exclude_raw=False exclude_fields="<comma-separated field names>"
description = \
    This command retrieves the results of the given complex GNQL queries using GreyNoise Python SDK.
shortdesc = Retrieves the results of the complex GNQL queries from GreyNoise.
example1 = | gnquery query="<GNQL_query>" result_size="50"
comment1 = Retrieve the results of GNQL_query with maximum 50 results
example2 = | gnquery query="<GNQL_query>"
comment2 = Retrieve GNQL results using default paging (1000 rows per GNQL scroll request unless overridden)
example3 = | gnquery query="<GNQL_query>" page_size="500"
comment3 = Retrieve GNQL results requesting 500 rows per GNQL scroll page
example4 = | gnquery query="<GNQL_query>" exclude_fields="raw_data,tags"
comment4 = Omit listed fields from each GNQL hit in the API response
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = query

[gnrecall-command]
syntax = gnrecall query="<GNQL_query>" mode="timeseries|stats" start="<datetime>" end="<datetime>" result_size="<int>" page_size="<int>" interval="<interval>"
description = \
    This command retrieves GreyNoise Recall GNQL activity over time using the GreyNoise Python SDK \
    (timeseries rows via recall, or aggregated stats via recall_stats).
shortdesc = Retrieves Recall time-series or stats for a GNQL query from GreyNoise.
example1 = | gnrecall query="<GNQL_query>" start="-7d" end="now"
comment1 = Retrieve Recall time-series rows for the GNQL query over the last seven days
example2 = | gnrecall query="<GNQL_query>" mode="stats" interval="day"
comment2 = Retrieve aggregated Recall stats bucketed by day
example3 = | gnrecall query="<GNQL_query>" result_size="500" page_size="100"
comment3 = Retrieve up to 500 Recall timeseries rows using 100-row API pages
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = recall

[gnstats-command]
syntax = gnstats query="<GNQL_query>" count="<int>"
description = \
    This command fetches the aggregate statistics for the top organizations, actors, tags, ASNs, countries, classifications, \
    and operating systems of all the results for a given GNQL query.
shortdesc = Retrieves aggregation statistics for the top entities for a given GNQL query.
example1 = | gnstats query="<GNQL_query>" count="10"
comment1 = Retrieve aggregate statistics in organizations, actors, tags, ASNs, countries, classifications, and operating systems from the results of the given GNQL_query
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = stats

[GNQL_query]
syntax = <string>
description = GNQL query whose results needs to be retrieved from GreyNoise

[gnmulti-command]
syntax = gnmulti ip_field="<ip_field>"
description = \
    This command retrieves Internet Scanner and Business Service Intelligence status of the IP addresses present in the ip_field of each events, \
    and adds the Internet Scanner and Business Service Intelligence status information to each event
shortdesc = Retrieves Internet Scanner and Business Service Intelligence status of the IP addresses represented by ip_field parameter present in each event, and adds the Internet Scanner and Business Service Intelligence information to each event.
example1 = SPL_QUERY | gnmulti ip_field=<ip_field>
category = transforming
appears-in = 3.1.0
maintainer = GreyNoise
usage = public
tags = multi

[gncontext-command]
syntax = gncontext ip="<ip_address>"
description = This command fetches the context information of the given IP address using GreyNoise python SDK.
shortdesc = Retrieves context information about IP from the GreyNoise.
example1 = | gncontext ip="<ip_address>"
comment1 = Retrieve the context information of the given ip_address
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = context

[gnfilter-command]
syntax = gnfilter ip_field="<ip_field>" noise_events="<bool>"
description = \
    This command filters Splunk events returned by given SPL_QUERY based on the internet scanner status \
    of IP address present in ip_field of the events
shortdesc = Filters the events based on the internet scanner status of IP address represented by ip_field.
example1 = SPL_QUERY | gnfilter ip_field="<ip_field>" noise_events="true"
comment1 = Filters the events having ip represented by ip_field and outputs the only events that are having noisy IP addresses.
usage = public
appears-in = 3.1.0
category = transforming
maintainer = GreyNoise
tags = filter

[gnenrich-command]
syntax = gnenrich ip_field="<ip_field>"
description = \
    This command enriches the Splunk events returned by given SPL_QUERY with the context information \
    of IP address represented by ip_field in Splunk Search.
shortdesc = Enriches the Splunk events with the context information of IP address represented by ip_field.
example1 = SPL_QUERY | gnenrich ip_field="<ip_field>"
comment1 = Enriches the events with the context information of the IP address represented by the IP field.
usage = public
appears-in = 3.1.0
category = transforming
maintainer = GreyNoise
tags = enrich

[gncallback-command]
syntax = gncallback ip_field="<ip_field>" source_workspace="<source_workspace>"
description = \
    This command enriches the Splunk events returned by given SPL_QUERY with GreyNoise Callback \
    intelligence for the IP address represented by ip_field in Splunk Search.
shortdesc = Enriches the Splunk events with Callback intelligence for IP address represented by ip_field.
example1 = SPL_QUERY | gncallback ip_field="<ip_field>"
comment1 = Enriches the events with Callback intelligence for the IP address represented by the IP field.
example2 = SPL_QUERY | gncallback ip_field="<ip_field>" source_workspace="all"
comment2 = Enriches the events with Callback intelligence, optionally filtering to a source workspace.
usage = public
appears-in = 3.1.0
category = transforming
maintainer = GreyNoise
tags = callback

[gncallbackfeed-command]
syntax = gncallbackfeed
description = \
    This command retrieves Callback IPs using filters from the Callback IP Feed configuration page \
    and the callback_list method in the GreyNoise Python SDK. Used by scheduled feed saved searches \
    to populate the greynoise_callback_indicators store.
shortdesc = Retrieves Callback IP feed indicators using configured callback_list filters.
example1 = | gncallbackfeed
comment1 = Retrieve Callback IP indicators using the Callback IP Feed configuration settings
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = callback

[gnfeed-command]
syntax = gnfeed query="<GNQL_query>" result_size="<int>" page_size="<int>" include_raw=False
description = \
    This command retrieves GNQL results and emits only the fields stored in the greynoise_indicators \
    lookup. Unlike gnquery, it does not attach a Splunk _raw copy of each IP payload unless \
    include_raw is true or Feed ingest-to-index is enabled. When query is omitted, the latest \
    query from gn_feed_lookup is used.
shortdesc = Retrieves GreyNoise feed indicators for the greynoise_indicators lookup.
example1 = | gnfeed
comment1 = Retrieve feed indicators using the GNQL query saved in gn_feed_lookup
example2 = | gnfeed query="last_seen:1d classification:malicious" result_size="50000"
comment2 = Retrieve feed indicators for an explicit GNQL query
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = feed

[ip_field]
syntax = <string>
description = Name of the field representing IP address in Splunk events

[source_workspace]
syntax = <string>
description = Optional Callback source workspace filter (default: all)

[gniptimeline-command]
syntax = gniptimeline ip_address="<ip_address>" days="<int>" field="<field>" granularity="<granularity>"
description = \
    This command retrieves the timeline events for the provided IP using GreyNoise Python SDK.
shortdesc = Retrieves the timeline events from GreyNoise.
example1 = | gnquery ip_address="<ip_address>" days="30" field="classification" granularity="1h"
comment1 = Retrieve the last 30 days of timeline events.
usage = public
appears-in = 3.1.0
category = generating
maintainer = GreyNoise
tags = timeline

[gncve-command]
syntax = gncve cve="<cve_id>"
description = \
    This command retrieves the CVE information for the provided CVE ID using GreyNoise Python SDK.
shortdesc = Retrieves the CVE information events from GreyNoise.
example1 = | gncve cve="<cve_id>"
comment1 = Retrieve the CVE information
usage = public
appears-in = 3.1.0
maintainer = GreyNoise
tags = cve