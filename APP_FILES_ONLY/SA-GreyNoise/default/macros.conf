[greynoise_fields]
definition = dest, dvc, src, dest_ip, src_ip, dvc_ip, orig_src, orig_dest, host, source, dest_translated_ip, src_translated_ip
iseval = 0

[greynoise_indexes]
definition = main
iseval = 0

[greynoise_caching]
definition = 1
iseval = 0

[greynoise_ttl]
definition = 24
iseval = 0

[greynoise_other_fields]
definition = dest, dvc, src, dest_ip, src_ip, dvc_ip, orig_src, orig_dest, host, source, dest_translated_ip, src_translated_ip
iseval = 0

[greynoise_feed_partial_search]
definition = | noop
iseval = 0

[gn_fw_index]
definition = index=pan* sourcetype=pan:traffic

[gn_vpn_index]
definition = index=pan* sourcetype=pan:globalprotect
iseval = 0

[gn_is_internal(1)]
args = ip_field
definition = if(cidrmatch("10.0.0.0/8",$ip_field$) OR cidrmatch("172.16.0.0/12",$ip_field$) \
    OR cidrmatch("192.168.0.0/16",$ip_field$) OR cidrmatch("fc00::/7",$ip_field$) \
    OR cidrmatch("fe80::/10",$ip_field$) OR cidrmatch("fec0::/10",$ip_field$), 1, 0)

[gn_fw_scope]
definition = `gn_fw_index` \
| eval src_is_internal  = `gn_is_internal(src_ip)`, \
       dest_is_internal = `gn_is_internal(dest_ip)` \
| eval traffic_direction = case( \
       src_is_internal=0 AND dest_is_internal=1, "Inbound", \
       src_is_internal=1 AND dest_is_internal=0, "Outbound", \
       src_is_internal=1 AND dest_is_internal=1, "Internal", \
       true(), "Transit") \
| where traffic_direction IN ("Inbound","Outbound") \
| eval gn_ip       = if(traffic_direction="Inbound", src_ip,  dest_ip), \
       internal_ip = if(traffic_direction="Inbound", dest_ip, src_ip) \
| eval is_allowed  = if(lower(action) IN ("allow","accept","pass","permit"), 1, 0), \
       xfer_bytes  = coalesce(bytes_out, bytes, 0)

[gn_vpn_scope]
definition = `gn_vpn_index` \
| eval vpn_status = lower(coalesce(status, auth_status, result, action)) \
| eval vpn_status = case(match(vpn_status,"success|succeeded|allow"), "success", \
                         match(vpn_status,"fail|denied|error"), "failure", \
                         true(), vpn_status)